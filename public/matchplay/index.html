<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Match Play Montravel</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Match Play">
<meta name="theme-color" content="#1f5c3e">
<link rel="icon" href="/icon.png"><link rel="apple-touch-icon" href="/icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout : une carte de match plein écran, un trou à la fois, gros boutons pour jouer au doigt sur le parcours */
:root{
  --bg:#eef2ec; --card:#ffffff; --ink:#15261c; --muted:#5d6b62; --line:#d6ddd6;
  --green:#1f5c3e; --green-soft:#e1efe6; --prudent:#1f6fd1; --prudent-soft:#e3edfb;
  --attack:#d9540b; --attack-soft:#fbe9dd; --win:#1d7a45; --lose:#b3261e; --gold:#c9a45c;
  --display:"Fraunces",Georgia,serif; --body:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1712; --card:#18231c; --ink:#e7efe9; --muted:#9db0a3; --line:#2b3a31;
  --green:#7fcf9f; --green-soft:#1d3226; --prudent:#7fb0ff; --prudent-soft:#1a2a40;
  --attack:#ff9a5c; --attack-soft:#3a2416; --win:#6fd39a; --lose:#ff8a80; --gold:#d8b878; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --card:#18231c; --ink:#e7efe9; --muted:#9db0a3; --line:#2b3a31;
  --green:#7fcf9f; --green-soft:#1d3226; --prudent:#7fb0ff; --prudent-soft:#1a2a40;
  --attack:#ff9a5c; --attack-soft:#3a2416; --win:#6fd39a; --lose:#ff8a80; --gold:#d8b878; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.05}
h2{font-size:22px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
button{font-family:var(--body);font-size:16px;font-weight:600;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);padding:12px 14px;min-height:46px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--prudent);outline-offset:2px}
button.primary{background:var(--green);border-color:var(--green);color:var(--card)}
button.ghost{background:transparent}
button.danger{color:var(--lose)}
.preset{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%}
.preset small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;letter-spacing:.02em}
.tag.net{background:var(--attack-soft);color:var(--attack)}
.tag.brut{background:var(--green-soft);color:var(--green)}
label{font-size:13px;color:var(--muted);font-weight:600}
input,select{font-family:var(--body);font-size:17px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
/* status band */
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--green);color:var(--card);border-radius:14px;padding:12px 14px}
.status .big{font-family:var(--display);font-size:28px;line-height:1}
.status .who{font-size:13px;opacity:.85}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1px solid rgba(255,255,255,.5);color:var(--card)}
.dot.w{background:var(--win);border-color:var(--win)} .dot.l{background:var(--lose);border-color:var(--lose)} .dot.h{background:rgba(255,255,255,.25)}
.dot.cur{outline:2px solid var(--gold);outline-offset:1px}
/* hole */
.holehead{display:flex;align-items:flex-end;gap:12px}
.holenum{font-family:var(--display);font-size:56px;line-height:.85}
.holegrid{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;align-items:start}
.holeimg{border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.holeimg svg{display:block;width:100%;height:auto}
.plan{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.plan.p{background:var(--prudent-soft);border:1px solid var(--prudent)}
.plan.a{background:var(--attack-soft);border:1px solid var(--attack)}
.plan .ttl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.plan.p .ttl{color:var(--prudent)} .plan.a .ttl{color:var(--attack)}
.shot{display:flex;gap:8px;font-size:15px;line-height:1.3}
.shot b{flex-shrink:0;min-width:24px;height:22px;border-radius:11px;color:var(--card);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.plan.p .shot b{background:var(--prudent)} .plan.a .shot b{background:var(--attack)}
.why{font-size:14.5px;line-height:1.4;border-left:3px solid var(--gold);padding-left:10px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{padding:8px 6px;font-size:14px;min-height:42px}
.seg button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.toggle button.on.p{background:var(--prudent);border-color:var(--prudent);color:var(--card)}
.toggle button.on.a{background:var(--attack);border-color:var(--attack);color:var(--card)}
/* score entry */
.scorebox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px}
.stepper .n{font-family:var(--display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.stepper .ctrl{display:flex;gap:8px}
.stepper .ctrl button{width:52px;font-size:24px;padding:4px}
.stepper .netv{font-size:13px;color:var(--muted)}
.between{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.between.w{background:var(--green-soft)} .between.l{background:var(--attack-soft)} .between.h{background:var(--card);border:1px solid var(--line)}
.between .res{font-family:var(--display);font-size:26px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14.5px}
th,td{padding:6px 4px;text-align:center;border-top:1px solid var(--line)}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tw{color:var(--win);font-weight:700}.tl{color:var(--lose);font-weight:700}
.scroll{overflow-x:auto}
.footer{display:flex;gap:8px}
.footer button{flex:1}
.confirm{background:var(--attack-soft);border:1px solid var(--attack);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
@media (max-width:380px){.holegrid{grid-template-columns:100px minmax(0,1fr)}.holenum{font-size:46px}}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .25s ease-out}@keyframes f{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

</head><body>

  when:"Si l'adversaire est sur le green en 1, ou si tu dois gagner le trou.",note:"Bunker devant le green. Un 4 propre gagne souvent ce trou."},
];
const PRESETS = [
  {id:"decima",opp:"Jean-Louis Decima",type:"brut",strokes:0,label:"Brut · poule B · avant le 30/11"},
  {id:"sillien",opp:"Laurent Sillien",type:"net",strokes:4,label:"Net mixte · 1er tour · avant le 30/11"},
  {id:"faro",opp:"Michael Faro",type:"brut",strokes:0,label:"Brut · poule B · avant le 31/12"},
  {id:"jf",opp:"Jean-François Deffarge",type:"brut",strokes:0,label:"Brut · poule B · avant le 31/01"},
];
const KEY="mp-montravel-v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{matches:[]}}catch(e){return {matches:[]}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(); let view={name:"home"}; let ui={};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// coups reçus par trou (positif = je reçois, négatif = je rends)
function strokesOn(hole,strokes){const k=Math.abs(strokes);let s=Math.floor(k/9)+((hole.hcp<=k%9)?1:0);return strokes>=0?s:-s}
function holeAt(i){return HOLES[i%9]}
function result(m,i){const r=m.scores[i];if(!r||r.me==null||r.op==null)return null;
  const s=m.type==="net"?strokesOn(holeAt(i),m.strokes):0;
  const me=r.me-Math.max(s,0), op=r.op-Math.max(-s,0);
  return me<op?1:me>op?-1:0}
function state(m){let up=0,played=0,seq=[];for(let i=0;i<m.scores.length;i++){const r=result(m,i);if(r===null)break;up+=r;played++;seq.push(r)}
  const left=Math.max(0,9-played);let over=false,txt="";
  if(played<=9&&Math.abs(up)>left&&played>0){over=true}
  if(played>=9&&up!==0)over=true;
  return {up,played,left,over,seq}}
function upTxt(up){return up===0?"Égalité":up>0?`${up} UP`:`${-up} DOWN`}
function finalTxt(st){if(st.up===0)return "Égalité";const w=st.up>0;const a=Math.abs(st.up);
  let t=st.played<9?`${a} & ${st.left}`:(st.played===9?`${a} UP`:"au trou supplémentaire");
  if(st.played>9)t=`au ${st.played}e trou`;return (w?"Gagné ":"Perdu ")+t}

function decide(m,i,st,oppState){
  const h=holeAt(i), s=m.type==="net"?strokesOn(h,m.strokes):0;
  const left=Math.max(1,9-st.played); const up=st.up;
  let mode="p", why=[];
  if(i>=9){mode=oppState==="trouble"?"a":"p";why.push("Trou supplémentaire : le premier qui gagne un trou remporte le match.");}
  else if(up===left){why.push("Dormie : un trou partagé te suffit pour gagner le match. Plan prudent, aucun risque.");}
  else if(-up===left){mode="a";why.push("Tu dois gagner ce trou pour rester en vie. Plan attaque.");}
  else if(up<=-2&&left<=4){mode="a";why.push(`Mené de ${-up} avec ${left} trous à jouer : il faut créer des occasions.`);}
  else if(up>=2){why.push(`Tu mènes ${up} UP : fais jouer ton adversaire, c'est à lui de prendre les risques.`);}
  else if(up===1){why.push("Tu mènes d'un trou : reste sur ton plan prudent.");}
  else if(up<0){why.push("Un seul trou de retard, il reste du temps : plan prudent, attends l'erreur.");}
  else why.push("Match à égalité : plan prudent par défaut.");
  if(oppState==="trouble"&&mode==="p"&&up!==left){mode="a";why.push("L'adversaire est en difficulté : c'est le moment d'aller chercher le trou.");}
  if(oppState==="great"&&mode==="p"&&up<left){why.push("L'adversaire est très bien placé : vise le centre du green, un bon 2 putts peut suffire s'il rate son putt.");}
  if(s>0)why.push(`Tu reçois ${s>1?s+" coups":"un coup"} : ton ${h.par+s} vaut son ${h.par}. Un bogey propre suffit souvent.`);
  if(s<0)why.push(`Tu rends ${-s>1?-s+" coups":"un coup"} sur ce trou : son ${h.par+(-s)} vaut ton ${h.par}. Vise le par.`);
  return {mode,why,s}}

function svgHole(h,mode){
  const line=(pts,c,d,w)=>{const p=pts.map(x=>x.join(",")).join(" ");return `<polyline points="${p}" fill="none" stroke="#fff" stroke-width="${w+6}" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><polyline points="${p}" fill="none" stroke="${c}" stroke-width="${w}" stroke-dasharray="${d}" stroke-linecap="round" stroke-linejoin="round"/>`};
  const dots=(pts,c,l)=>pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="44" fill="${c}" fill-opacity=".22" stroke="${c}" stroke-width="5"/><circle cx="${q[0]}" cy="${q[1]}" r="27" fill="${c}" stroke="#fff" stroke-width="4"/><text x="${q[0]}" y="${q[1]+10}" text-anchor="middle" font-family="IBM Plex Sans Condensed,sans-serif" font-weight="700" font-size="28" fill="#fff">${l}${i+1}</text>`).join("");
  const PC="#1f6fd1",AC="#d9540b";const fade=mode==="p"?.35:1,fadeP=mode==="a"?.35:1;
  return `<svg viewBox="0 110 765 1625" role="img" aria-label="Trou ${h.n}, plan ${mode==="p"?"prudent":"attaque"}"><image href="${IMG[h.n]}" x="0" y="110" width="765" height="1625" preserveAspectRatio="none"/>
  <g opacity="${fadeP}">${line([h.tee,...h.P],PC,"18 12",8)}</g><g opacity="${fade}">${line([h.tee,...h.A],AC,"4 12",7)}</g>
  <circle cx="${h.tee[0]}" cy="${h.tee[1]}" r="16" fill="#f2d500" stroke="#fff" stroke-width="5"/>
  <g opacity="${fadeP}">${dots(h.P,PC,"P")}</g><g opacity="${fade}">${dots(h.A,AC,"A")}</g></svg>`}

function statusBand(m,st,cur){
  const dots=[];const n=Math.max(9,st.played+(st.over?0:1));
  for(let i=0;i<n;i++){const r=i<st.seq.length?st.seq[i]:null;const c=r===1?"w":r===-1?"l":r===0?"h":"";dots.push(`<span class="dot ${c} ${i===cur?"cur":""}">${i+1}</span>`)}
  return `<div class="status"><div><div class="big">${st.over?finalTxt(st):upTxt(st.up)}</div><div class="who">contre ${esc(m.opp)} · ${m.type==="net"?`net, ${m.strokes>=0?"tu reçois "+m.strokes:"tu rends "+(-m.strokes)} coup${Math.abs(m.strokes)>1?"s":""}`:"brut"}</div></div><div class="dots" style="max-width:55%;justify-content:flex-end">${dots.join("")}</div></div>`}

function render(){const app=$("#app");
  if(view.name==="home")app.innerHTML=homeV();
  else if(view.name==="setup")app.innerHTML=setupV();
  else if(view.name==="play")app.innerHTML=playV();
  else if(view.name==="between")app.innerHTML=betweenV();
  else if(view.name==="summary")app.innerHTML=summaryV();
  else if(view.name==="manual")app.innerHTML=manualV();
  bind()}

// Résultats connus, saisis hors application (le téléphone peut ne pas les avoir)
const KNOWN = {decima:{won:true,txt:"1 UP",date:"13/11"}};
function matchFor(p){return S.matches.find(m=>m.preset===p.id)||S.matches.find(m=>!m.preset&&m.opp===p.opp)}
function outcome(p){const m=matchFor(p);
  if(m&&m.manual)return {done:true,won:m.manual.won,txt:(m.manual.won?"Gagné ":"Perdu ")+m.manual.txt,m};
  if(m){const st=state(m);if(st.over)return {done:true,won:st.up>0,txt:finalTxt(st),m};
    const k=KNOWN[p.id];if(k)return {done:true,won:k.won,txt:(k.won?"Gagné ":"Perdu ")+k.txt,m};return {done:false,live:st.played>0,txt:st.played?upTxt(st.up)+" après "+st.played+" trou"+(st.played>1?"s":""):"Match ouvert",m}}
  const k=KNOWN[p.id];if(k)return {done:true,won:k.won,txt:(k.won?"Gagné ":"Perdu ")+k.txt};
  return {done:false,live:false,txt:"À jouer"}}
function homeV(){
  const poule=PRESETS.filter(p=>p.type==="brut");const pts=poule.filter(p=>{const o=outcome(p);return o.done&&o.won}).length;const joues=poule.filter(p=>outcome(p).done).length;
  const card=p=>{const o=outcome(p);
    const tag=o.done?`<span class="tag ${o.won?"brut":"net"}">${o.won?"Gagné":"Perdu"}</span>`:o.live?`<span class="tag net">En cours</span>`:`<span class="tag ${p.type}">${p.type==="net"?"Net":"Brut"}</span>`;
    const main=o.m?`data-open="${o.m.id}"`:(o.done?"disabled":`data-preset="${p.id}"`);
    return `<div class="stack" style="gap:6px"><button class="preset" ${main}><span>${esc(p.opp)}<small>${p.label}${p.strokes?` · tu reçois ${p.strokes} coups`:""}</small><small style="color:var(--ink);font-weight:600">${esc(o.txt)}</small></span>${tag}</button>
    ${!o.done&&!o.live?`<button class="ghost" style="min-height:38px;padding:6px 10px;font-size:14px" data-manual="${p.id}">Match déjà joué ? Saisir le résultat</button>`:""}</div>`};
  const others=S.matches.filter(m=>!PRESETS.some(p=>m.preset===p.id||m.opp===p.opp)).slice().reverse().map(m=>{const st=state(m);return `<button class="preset" data-open="${m.id}"><span>${esc(m.opp)}<small>${m.type==="net"?"Net":"Brut"} · ${m.manual?(m.manual.won?"Gagné ":"Perdu ")+esc(m.manual.txt):st.over?finalTxt(st):(st.played?upTxt(st.up)+" après "+st.played:"pas commencé")}</small></span><span class="tag ${m.type}">${m.manual||st.over?"Terminé":"Reprendre"}</span></button>`}).join("");
  return `<div class="fade stack"><div><div class="eyebrow">Championnat du club · Golf de Montravel</div><h1>Match play</h1></div>
  <div class="card stack"><div class="row" style="justify-content:space-between"><h2>Brut · poule B</h2><span class="tag brut">${pts} pt${pts>1?"s":""} · ${joues}/3 joués</span></div>
  ${poule.map(card).join("")}<p class="muted" style="margin:0;font-size:13.5px">Un seul match contre chaque adversaire. Les deux premiers de la poule vont en huitièmes.</p></div>
  <div class="card stack"><h2>Net mixte</h2>${PRESETS.filter(p=>p.type==="net").map(card).join("")}</div>
  <div class="card stack"><h2>Tours suivants</h2>${others||`<p class="muted" style="margin:0;font-size:14px">Pour un huitième de finale ou le tour suivant en net, crée le match ici.</p>`}
  <button class="ghost" data-go="setup">Nouvel adversaire…</button></div>
  <p class="muted" style="font-size:13px;margin:0">Les matchs restent enregistrés sur ce téléphone.</p></div>`}

function manualV(){const p=PRESETS.find(x=>x.id===view.pid);return `<div class="fade stack"><div><div class="eyebrow">${esc(p.label)}</div><h1>${esc(p.opp)}</h1></div>
  <div class="card stack"><div><label>Résultat</label><div class="toggle"><button data-res="1" class="p ${ui.won!==false?"on":""}">Gagné</button><button data-res="0" class="a ${ui.won===false?"on":""}">Perdu</button></div></div>
  <div><label for="f-txt">Score du match</label><input id="f-txt" placeholder="1 UP, 3 & 2…" value="${esc(ui.txt||"")}"></div></div>
  <div class="footer"><button class="ghost" data-go="home">Annuler</button><button class="primary" id="savemanual">Enregistrer</button></div></div>`}

function setupV(){return `<div class="fade stack"><div><div class="eyebrow">Nouveau match</div><h1>Autre adversaire</h1></div>
  <div class="card stack"><div><label for="f-opp">Nom de l'adversaire</label><input id="f-opp" placeholder="Prénom Nom"></div>
  <div><label for="f-type">Formule</label><select id="f-type"><option value="brut">Brut</option><option value="net">Net</option></select></div>
  <div><label for="f-str">Coups reçus par toi (net) · négatif si tu en rends</label><input id="f-str" type="number" inputmode="numeric" value="0"></div>
  <p class="muted" style="margin:0;font-size:14px">Les coups se placent sur les trous de handicap 1, 2, 3… de la carte du match play : 9, 5, 2, 7, 4, 6, 8, 3, 1.</p></div>
  <div class="footer"><button class="ghost" data-go="home">Annuler</button><button class="primary" id="create">Commencer</button></div></div>`}

function cur(){return S.matches.find(m=>m.id===view.id)}
function playV(){const m=cur();const st=state(m);const i=st.played;const h=holeAt(i);
  const opp=ui.opp||"none";const d=decide(m,i,st,opp);const mode=ui.mode||d.mode;
  const r=m.scores[i]||{me:h.par+1,op:h.par+1};ui.me=ui.me??r.me;ui.op=ui.op??r.op;
  const s=d.s;const netMe=m.type==="net"&&s>0?` · net ${ui.me-s}`:"";const netOp=m.type==="net"&&s<0?` · net ${ui.op+s}`:"";
  const plan=mode==="p"?h.p:h.a;
  return `<div class="fade stack">${statusBand(m,st,i)}
  <div class="card stack">
    <div class="holehead"><div class="holenum">${i+1}</div><div><div class="eyebrow">${i>=9?"Trou supplémentaire · ":""}Par ${h.par} · ${h.dist} · ${h.slope}</div><div style="font-weight:700">Handicap ${h.hcp}${s>0?` · <span class="tag net">tu reçois ${s} coup</span>`:s<0?` · <span class="tag brut">tu rends ${-s} coup</span>`:""}</div></div></div>
    <div><label>Situation de l'adversaire</label><div class="seg" role="group" aria-label="Situation de l'adversaire">
      <button data-opp="none" class="${opp==="none"?"on":""}">Pas encore joué</button><button data-opp="great" class="${opp==="great"?"on":""}">Bien placé</button><button data-opp="trouble" class="${opp==="trouble"?"on":""}">En difficulté</button></div></div>
    <div class="why">${d.why.map(esc).join("<br>")}</div>
    <div class="toggle" role="group" aria-label="Plan de jeu"><button data-mode="p" class="p ${mode==="p"?"on":""}">Prudent${d.mode==="p"?" · conseillé":""}</button><button data-mode="a" class="a ${mode==="a"?"on":""}">Attaque${d.mode==="a"?" · conseillé":""}</button></div>
    <div class="holegrid"><div class="holeimg">${svgHole(h,mode)}</div>
      <div class="stack"><div class="plan ${mode}"><div class="ttl">${mode==="p"?"Plan prudent":"Plan attaque"}</div>${plan.map((t,k)=>`<div class="shot"><b>${mode==="p"?"P":"A"}${k+1}</b><span>${esc(t)}</span></div>`).join("")}
        ${mode==="a"?`<div style="font-size:13.5px"><b>Quand :</b> ${esc(h.when)}</div>`:""}</div>
        <div style="font-size:14px" class="muted">${esc(h.note)}</div></div></div>
  </div>
  <div class="card stack"><h3>Score du trou</h3><div class="scorebox">
    <div class="stepper"><div class="eyebrow">Toi</div><div class="n" id="v-me">${ui.me}</div><div class="ctrl"><button data-step="me,-1" aria-label="Moins un coup pour toi">−</button><button data-step="me,1" aria-label="Plus un coup pour toi">+</button></div><div class="netv">par ${h.par}${netMe}</div></div>
    <div class="stepper"><div class="eyebrow">${esc(m.opp.split(" ")[0])}</div><div class="n" id="v-op">${ui.op}</div><div class="ctrl"><button data-step="op,-1" aria-label="Moins un coup pour l'adversaire">−</button><button data-step="op,1" aria-label="Plus un coup pour l'adversaire">+</button></div><div class="netv">par ${h.par}${netOp}</div></div></div>
    <button class="ghost" data-concede="op">${esc(m.opp.split(" ")[0])} concède le trou</button>
    <button class="primary" id="validate">Valider le trou ${i+1}</button>
  </div>
  <div class="footer">${i>0?`<button class="ghost" id="undo">Corriger le trou ${i}</button>`:""}<button class="ghost" data-go="home">Mes matchs</button></div></div>`}

const TIPS_WIN=["Même routine, même rythme : ne change rien parce que tu gagnes.","Un trou gagné ne se rejoue pas : concentre-toi sur le départ suivant.","Laisse ton adversaire prendre les risques maintenant."];
const TIPS_LOSE=["Trou perdu, rien de plus : un seul trou au tableau. Respire avant le départ.","Oublie ce trou en marchant vers le départ suivant. Routine complète.","Le match play pardonne : un bon trou efface celui-ci."];
const TIPS_HALF=["Trou partagé : rien de perdu. Garde ton plan.","Égalité sur ce trou : c'est souvent un bon résultat en match play."];
function pick(a,k){return a[k%a.length]}
function betweenV(){const m=cur();const st=state(m);const i=st.played-1;const r=st.seq[i];
  const cls=r===1?"w":r===-1?"l":"h";const res=r===1?"Trou gagné":r===-1?"Trou perdu":"Trou partagé";
  const sc=m.scores[i];
  let tips=[pick(r===1?TIPS_WIN:r===-1?TIPS_LOSE:TIPS_HALF,i)];
  if(sc.me-holeAt(i).par>=3)tips.push("Gros score sur ce trou : en match play, quand le trou est perdu, ramasse la balle et passe au suivant. Garde ton énergie.");
  if(st.over){return `<div class="fade stack">${statusBand(m,st,-1)}<div class="between ${st.up>0?"w":st.up<0?"l":"h"}"><div class="eyebrow">Fin du match</div><div class="res">${finalTxt(st)}</div>
    <div>${st.up>0?"Bravo. Note le score sur la feuille de poule : 1 point.":"Match perdu, mais chaque partie compte pour la suite de la poule. Note ce qui a coûté des trous."}</div></div>
    <button class="primary" id="tosum">Voir la carte du match</button></div>`}
  if(st.played===9&&st.up===0){tips=["Égalité après 9 trous. Suis le règlement du club : en général, trous supplémentaires en mort subite à partir du 1."];}
  const nx=holeAt(st.played);const dn=decide(m,st.played,st,"none");
  return `<div class="fade stack">${statusBand(m,st,st.played)}
  <div class="between ${cls}"><div class="eyebrow">Trou ${i+1} · toi ${sc.me} · ${esc(m.opp.split(" ")[0])} ${sc.op}</div><div class="res">${res}</div>
  ${tips.map(t=>`<div>${esc(t)}</div>`).join("")}</div>
  <div class="card stack"><div class="eyebrow">Prochain trou</div><h2>Trou ${st.played+1} · par ${nx.par} · ${nx.dist}</h2>
    <div class="why">${dn.why.map(esc).join("<br>")}</div>
    <div class="plan ${dn.mode}"><div class="ttl">${dn.mode==="p"?"Plan prudent":"Plan attaque"} conseillé</div>${(dn.mode==="p"?nx.p:nx.a).map((t,k)=>`<div class="shot"><b>${dn.mode==="p"?"P":"A"}${k+1}</b><span>${esc(t)}</span></div>`).join("")}</div>
    <div class="muted" style="font-size:14px">${esc(nx.note)}</div>
    <button class="primary" id="next">Aller au départ du ${st.played+1}</button></div>
  ${st.played===9&&st.up===0?`<div class="muted" style="font-size:14px">Si le règlement prévoit autre chose, termine le match ici.</div><button class="ghost" id="tosum">Terminer à égalité</button>`:""}</div>`}

function summaryV(){const m=cur();if(m.manual)return `<div class="fade stack"><div class="card stack"><div class="eyebrow">${m.type==="net"?"Net":"Brut"}</div><h2>${esc(m.opp)}</h2><div class="res" style="font-family:var(--display);font-size:26px">${m.manual.won?"Gagné":"Perdu"} ${esc(m.manual.txt)}</div><p class="muted" style="margin:0">Résultat saisi sans le détail des trous.</p></div><div class="footer"><button class="ghost" data-go="home">Mes matchs</button></div>${ui.del?`<div class="confirm"><b>Supprimer ce match ?</b><div class="footer"><button class="ghost" id="nodel">Garder</button><button class="danger" id="yesdel">Supprimer</button></div></div>`:`<button class="ghost danger" id="del">Supprimer ce match</button>`}</div>`;const st=state(m);
  const rows=m.scores.map((sc,i)=>{const h=holeAt(i);const r=result(m,i);const s=m.type==="net"?strokesOn(h,m.strokes):0;
    return `<tr><td>${i+1}</td><td>${h.par}</td><td>${s>0?"+"+s:s<0?s:""}</td><td>${sc.me}</td><td>${sc.op}</td><td class="${r===1?"tw":r===-1?"tl":""}">${r===1?"Gagné":r===-1?"Perdu":"Partagé"}</td></tr>`}).join("");
  const won=st.seq.filter(x=>x===1).length,lost=st.seq.filter(x=>x===-1).length;
  return `<div class="fade stack">${statusBand(m,st,-1)}
  <div class="card stack"><h2>Carte du match</h2><div class="scroll"><table><tr><th>Trou</th><th>Par</th><th>Coup</th><th>Toi</th><th>${esc(m.opp.split(" ")[0])}</th><th>Trou</th></tr>${rows}</table></div>
  <div class="muted" style="font-size:14px">${won} trou${won>1?"s":""} gagné${won>1?"s":""}, ${lost} perdu${lost>1?"s":""}, ${st.seq.length-won-lost} partagé${st.seq.length-won-lost>1?"s":""}. Score brut : ${m.scores.reduce((a,b)=>a+b.me,0)} en ${m.scores.length} trous.</div></div>
  <div class="footer">${!st.over?`<button class="primary" data-resume="1">Reprendre</button>`:""}<button class="ghost" data-go="home">Mes matchs</button></div>
  ${ui.del?`<div class="confirm"><b>Supprimer ce match ?</b><div class="footer"><button class="ghost" id="nodel">Garder</button><button class="danger" id="yesdel">Supprimer</button></div></div>`:`<button class="ghost danger" id="del">Supprimer ce match</button>`}</div>`}

function newMatch(p){const ex=p.id&&matchFor(p);if(ex){view={name:"play",id:ex.id};ui={};render();return}const m={id:"m"+Date.now(),preset:p.id||null,opp:p.opp,type:p.type,strokes:p.type==="net"?p.strokes:0,date:Date.now(),scores:[]};S.matches.push(m);save();ui={};view={name:"play",id:m.id};render();window.scrollTo(0,0)}
function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ui={};view={name:b.dataset.go};render();window.scrollTo(0,0)});
  document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>newMatch(PRESETS.find(p=>p.id===b.dataset.preset)));
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{view={name:"summary",id:b.dataset.open};ui={};const m=cur();const st=state(m);if(!st.over&&!m.manual)view.name="play";render();window.scrollTo(0,0)});
  document.querySelectorAll("[data-manual]").forEach(b=>b.onclick=()=>{ui={};view={name:"manual",pid:b.dataset.manual};render()});
  document.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>{ui.txt=$("#f-txt").value;ui.won=b.dataset.res==="1";render()});
  const sm=$("#savemanual");if(sm)sm.onclick=()=>{const p=PRESETS.find(x=>x.id===view.pid);const txt=$("#f-txt").value.trim()||"—";S.matches.push({id:"m"+Date.now(),preset:p.id,opp:p.opp,type:p.type,strokes:p.strokes,date:Date.now(),scores:[],manual:{won:ui.won!==false,txt}});save();ui={};view={name:"home"};render()};
  const c=$("#create");if(c)c.onclick=()=>{const opp=$("#f-opp").value.trim()||"Adversaire";const type=$("#f-type").value;const strokes=parseInt($("#f-str").value,10)||0;newMatch({opp,type,strokes})};
  document.querySelectorAll("[data-opp]").forEach(b=>b.onclick=()=>{ui.opp=b.dataset.opp;ui.mode=null;render()});
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ui.mode=b.dataset.mode;render()});
  document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{const [k,dv]=b.dataset.step.split(",");ui[k]=Math.max(1,Math.min(15,ui[k]+parseInt(dv,10)));$("#v-"+k).textContent=ui[k];render()});
  const cc=$("[data-concede]");if(cc)cc.onclick=()=>{const m=cur();const st=state(m);ui.op=99;commit(m,st.played)};
  const v=$("#validate");if(v)v.onclick=()=>{const m=cur();commit(m,state(m).played)};
  const u=$("#undo");if(u)u.onclick=()=>{const m=cur();const st=state(m);const r=m.scores[st.played-1];m.scores.length=st.played-1;save();ui={me:r.me,op:r.op===99?holeAt(st.played-1).par+1:r.op};render()};
  const n=$("#next");if(n)n.onclick=()=>{ui={};view.name="play";render();window.scrollTo(0,0)};
  document.querySelectorAll("#tosum").forEach(b=>b.onclick=()=>{view.name="summary";ui={};render();window.scrollTo(0,0)});
  const rs=$("[data-resume]");if(rs)rs.onclick=()=>{view.name="play";ui={};render()};
  const dl=$("#del");if(dl)dl.onclick=()=>{ui.del=1;render()};
  const nd=$("#nodel");if(nd)nd.onclick=()=>{ui.del=0;render()};
  const yd=$("#yesdel");if(yd)yd.onclick=()=>{S.matches=S.matches.filter(m=>m.id!==view.id);save();ui={};view={name:"home"};render()};
}
function commit(m,i){m.scores[i]={me:ui.me,op:ui.op};m.scores.length=i+1;save();ui={};view.name="between";render();window.scrollTo(0,0)}
render();
</script>

</body></html>
